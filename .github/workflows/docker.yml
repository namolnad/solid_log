name: Build and Push Docker Images

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag, branch, or commit) to build'
        required: true
        default: 'main'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/solid_log-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      matrix:
        db_adapter: [sqlite, postgres, mysql]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists (scheduled builds only)
        if: github.event_name == 'schedule'
        id: check_image
        run: |
          # Get current commit SHA (short form)
          CURRENT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${CURRENT_SHA}-${{ matrix.db_adapter }}"

          echo "Checking for existing image: $IMAGE_TAG"

          # Try to inspect the image in the registry
          if docker buildx imagetools inspect "$IMAGE_TAG" > /dev/null 2>&1; then
            echo "Image already exists for commit $CURRENT_SHA. Skipping build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Image does not exist for commit $CURRENT_SHA. Proceeding with build."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        if: steps.check_image.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.db_adapter }}
            type=semver,pattern={{version}},suffix=-${{ matrix.db_adapter }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.db_adapter }}
            type=semver,pattern={{major}},suffix=-${{ matrix.db_adapter }}
            type=sha,prefix=,suffix=-${{ matrix.db_adapter }},enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest-${{ matrix.db_adapter }},enable={{is_default_branch}}
            type=raw,value=${{ inputs.ref }}-${{ matrix.db_adapter }},enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=false

      - name: Build and push Docker image
        if: steps.check_image.outputs.skip != 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DB_ADAPTER=${{ matrix.db_adapter }}
          cache-from: type=gha,scope=${{ matrix.db_adapter }}
          cache-to: type=gha,mode=max,scope=${{ matrix.db_adapter }}
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        if: steps.check_image.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
